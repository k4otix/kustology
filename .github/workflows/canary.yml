name: Upstream canary

# The Tests workflow installs from uv.lock, which keeps main reproducible but
# stops it from noticing when a dependency release breaks the published version
# ranges. This job resolves those ranges fresh, the way `pip install kustology`
# does, and reports when current code stops working against current upstreams.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  canary:
    name: unpinned / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Every cell reports: one broken platform must not mask the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-14
            python: "3.12"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      # No uv, no lock — resolve the ranges in pyproject.toml as a user would.
      - name: Install with a fresh resolve
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,ir]"

      # Recorded before the tests so a failing run carries the versions that
      # produced it.
      - name: Record resolved versions
        shell: bash
        run: |
          echo "### ${{ matrix.os }} / py${{ matrix.python }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m pip freeze | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: pytest -q

  report:
    name: File an issue when the canary breaks
    needs: canary
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const TITLE = "Upstream canary failing — a fresh dependency resolve breaks the tests"
            const LABEL = "upstream-canary"
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            // Dedupe on title rather than label, so a missing label cannot
            // turn one ongoing breakage into a new issue every Monday.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", per_page: 100,
            })
            const existing = open.find(i => i.title === TITLE && !i.pull_request)

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Still failing as of this run: ${url}`,
              })
              core.info(`Commented on #${existing.number}`)
              return
            }

            const body = [
              "The scheduled canary resolves the dependency ranges in `pyproject.toml`",
              "fresh, the way `pip install kustology` does. It just failed while the",
              "locked Tests workflow passes.",
              "",
              `Run: ${url}`,
              "",
              "That means a dependency published a release our declared ranges accept",
              "and our code does not survive. `main` is not broken, but anyone",
              "installing today may be.",
              "",
              "Each matrix cell's job summary lists the versions it resolved. Compare",
              "them against `uv.lock` to identify the package, then either adapt the",
              "code and run `uv lock --upgrade-package <name>`, or tighten the range",
              "in `pyproject.toml` and ship a patch release.",
            ].join("\n")

            const created = await github.rest.issues.create({
              ...context.repo, title: TITLE, body, labels: [LABEL],
            })
            core.info(`Opened #${created.data.number}`)
