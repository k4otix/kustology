name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Verify bundled DLL against the pin (offline, hard gate)
        run: python scripts/verify_dll.py --offline
      - name: Verify bundled DLL against NuGet (online, warning only)
        run: |
          python scripts/verify_dll.py || {
            rc=$?
            if [ "$rc" -eq 2 ]; then echo "::warning::verify_dll online leg unavailable (network/config, exit 2) — offline pin already verified"; exit 0; fi
            exit "$rc"
          }

      # workflow_dispatch runs may target a branch, not a version tag, so this
      # step (and the release-notes extraction below) only make sense — and
      # only have a CHANGELOG section to find — on an actual `v*` tag push.
      - name: Verify tag matches project version and CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT=$(python -c 'import re,pathlib;print(re.search(r"^__version__ = \"([^\"]+)\"$", pathlib.Path("src/kustology/_version.py").read_text(), re.M).group(1))')
          test "$VERSION" = "$PROJECT" || { echo "tag $GITHUB_REF_NAME != _version.py $PROJECT"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG has no [$VERSION] section"; exit 1; }

      - name: Build and Generate SBOM
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.5.0 cyclonedx-bom==7.3.0
          python -m build

          # Install the built wheel into a fresh venv (not this job's own
          # build/cyclonedx-bom tooling environment) so the SBOM describes
          # exactly what PyPI will ship.
          python -m venv /tmp/release-venv
          /tmp/release-venv/bin/pip install dist/*.whl
          cyclonedx-py environment "$(/tmp/release-venv/bin/python -c 'import sys;print(sys.prefix)')" \
            --output-format JSON --output-file release-sbom.json

      - name: Extract release notes for ${{ github.ref_name }}      # moved here from publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { p=1; next }
            p && /^## \[/             { exit }
            p                         { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG section for $VERSION"; exit 1; }
          echo "--- release-notes.md ($(wc -l < release-notes.md) lines) ---"
          cat release-notes.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/
            release-sbom.json
            release-notes.md
          if-no-files-found: warn

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/kustology
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      # Attest before publishing so a failure here doesn't leave a published-but-unattested artifact.
      # PyPI rejects re-uploads of the same version, so post-publish attestation failures are unrecoverable.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            dist/* \
            release-sbom.json
