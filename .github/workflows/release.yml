name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Verify bundled DLL matches NuGet before building
        run: python scripts/verify_dll.py

      # workflow_dispatch runs may target a branch, not a version tag, so this
      # step (and the release-notes extraction below) only make sense — and
      # only have a CHANGELOG section to find — on an actual `v*` tag push.
      - name: Verify tag matches project version and CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "$VERSION" = "$PROJECT" || { echo "tag $GITHUB_REF_NAME != pyproject $PROJECT"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG has no [$VERSION] section"; exit 1; }

      - name: Build and Generate SBOM
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.5.0 cyclonedx-bom==7.3.0
          python -m build

          # Install the built wheel into a fresh venv (not this job's own
          # build/cyclonedx-bom tooling environment) so the SBOM describes
          # exactly what PyPI will ship.
          python -m venv /tmp/release-venv
          /tmp/release-venv/bin/pip install dist/*.whl
          cyclonedx-py environment "$(/tmp/release-venv/bin/python -c 'import sys;print(sys.prefix)')" \
            --output-format JSON --output-file release-sbom.json

      - name: Extract release notes for ${{ github.ref_name }}      # moved here from publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { p=1; next }
            p && /^## \[/             { exit }
            p                         { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG section for $VERSION"; exit 1; }
          echo "--- release-notes.md ($(wc -l < release-notes.md) lines) ---"
          cat release-notes.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: |
            dist/
            release-sbom.json
            release-notes.md
          if-no-files-found: warn

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/kustology
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts

      # Attest before publishing so a failure here doesn't leave a published-but-unattested artifact.
      # PyPI rejects re-uploads of the same version, so post-publish attestation failures are unrecoverable.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v2
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          attestations: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            dist/* \
            release-sbom.json
