name: Tests

# Every job below hardens its runner with step-security/harden-runner at
# egress-policy: audit, not block. block requires an explicit allowlist of
# every outbound host a job touches, and this workflow's jobs collectively
# reach pypi.org, api.nuget.org, github.com (checkout + the microsoft/
# Kusto-Query-Language clone in corpus-regression), codecov.io and the
# actions/* runner toolcache -- none of it catalogued. audit still reports
# every outbound call in the job summary, which is the actionable half of
# the control without the risk of block silently breaking a step on a host
# nobody remembered to allowlist. Revisit once the reached-host set is
# enumerated and stable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job only needs to run on Pull Requests, not on pushes to main.
    if: github.event_name == 'pull_request'
    # Job-level permissions replace (not merge with) the workflow-level
    # block above, so contents: read is restated here alongside the write
    # scope actions/dependency-review-action needs to post its
    # comment-summary-in-pr: on-failure PR comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Review for vulnerable dependencies
        # Dependabot will automatically update this to the latest v4 SHA
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Every cell reports: a Windows or macOS failure must not hide behind a
      # cancelled Linux matrix, and vice versa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"  # Sanity check latest Python on Windows
          - os: macos-14
            python: "3.12"  # Sanity check latest Python on Apple Silicon
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # tests/ir/ used to run on exactly one matrix cell (the standalone
      # test-ir job below), so a python-version- or OS-specific IR regression
      # had five other cells to hide behind. Every cell now installs the [ir]
      # extra and runs the whole suite except one -- ubuntu-latest / py3.10 --
      # which stays on --extra test alone so `pip install kustology` without
      # [ir] is still proven to work on every push. That cell also proves the
      # plain-text rendering in examples/_display.py, since [examples] rides
      # along with [ir] on every other cell and brings rich with it.
      - name: Determine extras for this cell
        id: extras
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python }}" = "3.10" ]; then
            echo "flags=--extra test" >> "$GITHUB_OUTPUT"
          else
            echo "flags=--extra test --extra ir --extra examples" >> "$GITHUB_OUTPUT"
          fi

      - name: Install package (${{ steps.extras.outputs.flags }})
        run: uv sync --locked ${{ steps.extras.outputs.flags }} --python ${{ matrix.python }}

      - name: Run pytest with coverage
        run: uv run pytest -rs --cov=kustology --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-ir:
    name: Tier-2 IR tests (with pydantic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install package with [ir] extras
        run: uv sync --locked --extra test --extra ir
      - name: Run full pytest (including tests/ir/)
        run: uv run pytest -v -rs

  test-locale:
    name: Locale ${{ matrix.locale }}${{ matrix.tz && format(' / TZ={0}', matrix.tz) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every cell reports: de-DE and fr-FR fail differently (10x vs zero),
      # and the Asia/Tokyo cell guards a distinct bug class -- a
      # timezone-dependent defect that was just fixed and that a UTC-only
      # runner can never exercise, since UTC+0 hides the difference between
      # "converted" and "not converted."
      fail-fast: false
      matrix:
        include:
          - locale: "de_DE.UTF-8"
            tz: ""
          - locale: "fr_FR.UTF-8"
            tz: ""
          - locale: "en_US.UTF-8"
            tz: "Asia/Tokyo"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Install locale data
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen de_DE.UTF-8 fr_FR.UTF-8 en_US.UTF-8
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install package with [ir] extras
        run: uv sync --locked --extra test --extra ir
      # de-DE / fr-FR guard the culture pin: without it, fractional duration
      # literals parse 10x too large under de-DE and to zero under fr-FR --
      # see bridge._pin_invariant_culture. The Asia/Tokyo cell guards the
      # separate TZ-dependent bug; TZ is exported only where the matrix sets
      # one; the other two cells run under the runner's default UTC.
      - name: Run full pytest under ${{ matrix.locale }}${{ matrix.tz && format(' / TZ={0}', matrix.tz) || '' }}
        env:
          LANG: ${{ matrix.locale }}
          LC_ALL: ${{ matrix.locale }}
          TZ: ${{ matrix.tz }}
        run: uv run pytest -v -rs

  coverage-audit:
    name: SyntaxKind coverage audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install package with [ir] extras
        run: uv sync --locked --extra test --extra ir
      - name: Audit visitor coverage against Kusto.Language.dll
        run: uv run python scripts/audit_syntax_kinds.py --check

  corpus-regression:
    name: Sentinel corpus regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install package with [ir] extras
        run: uv sync --locked --extra test --extra ir
      - name: Mine the bundled Sentinel corpus for builder gaps
        run: uv run python scripts/mine_corpus.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # Lint tooling is pinned by uv.lock; upgrades arrive as dependabot PRs.
      - name: Install package + dev deps (locked)
        run: uv sync --locked --extra dev
      - name: ruff
        run: uv run ruff check src tests scripts examples
      - name: mypy
        run: uv run mypy src

  verify-dll:
    name: Verify bundled DLL provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify bundled Kusto.Language.dll against its offline pin
        run: python scripts/verify_dll.py --offline
      - name: Verify bundled Kusto.Language.dll matches NuGet (online)
        # The offline pin check above is the hard gate against tampering.
        # This online check additionally confirms the pin still matches
        # what nuget.org serves today, but a nuget.org outage or other
        # network/config trouble (exit 2) is not a tampering signal and
        # must not fail the build the same way a real hash mismatch
        # (exit 1) does -- conflating the two is exactly what this script
        # was split into --offline/--online for.
        run: |
          set +e
          python scripts/verify_dll.py
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "Hash mismatch: bundled DLL does not match its NuGet source." >&2
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::Online DLL verification was inconclusive (exit $rc) -- likely a network or config issue, not tampering. The offline pin check above already passed."
          fi
      - name: Set up .NET 8 for upstream corpus mine
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install [ir] extras for corpus mine
        run: uv sync --locked --extra test --extra ir
      - name: Mine Microsoft's KQL corpus for new builder gaps (soft signal)
        run: uv run python scripts/mine_corpus.py --remote-microsoft --soft
        continue-on-error: true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install package (runtime deps only)
        run: uv sync --locked
      # Scans .venv so the SBOM describes shipped dependencies rather than the
      # generator's own tree.
      - name: Generate CycloneDX SBOM
        run: |
          uvx --from cyclonedx-bom cyclonedx-py environment .venv \
            --output-format JSON --output-file sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
