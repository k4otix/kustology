# Mirror of CI checks (.github/workflows/test.yml) so contributors fail fast.
# Run once after cloning: pre-commit install
# Run manually:           pre-commit run --all-files

repos:
  # Keep `rev` in step with the ruff pinned in uv.lock, or this lints with a
  # different rule set than CI.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies: ["pydantic>=2.6.0"]
        args: [--config-file=pyproject.toml]
        files: ^src/
