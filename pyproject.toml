[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kustology"
version = "0.2.0"
description = "A Python wrapper for the Kusto.Language parser (Microsoft.Azure.Kusto.Language NuGet package). Not affiliated with Microsoft."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{name = "Eddie Allan"}]
# This handles the root-level files for the built wheel
license-files = ["LICENSE", "NOTICE.md", "THIRD-PARTY-NOTICES.md"]
dependencies = [
    "pythonnet>=3.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/k4otix/kustology"
Repository = "https://github.com/k4otix/kustology"
Changelog = "https://github.com/k4otix/kustology/blob/main/CHANGELOG.md"
Issues = "https://github.com/k4otix/kustology/issues"
Documentation = "https://github.com/k4otix/kustology/blob/main/docs/README.md"

[project.scripts]
kustology = "kustology.cli:main"

[project.optional-dependencies]
# Tier-2 opinionated IR. Activates kustology.ir.* — pydantic-typed
# operator / expression models plus a schema binder.
ir = [
    "pydantic>=2.6.0",
]
# Base test extras — NO pydantic. The CI matrix uses these to prove
# `pip install kustology` still works without the IR extras.
# pyyaml is here, not only under `dev`, because the sample_sentinel_corpus
# tests in tests/test_scripts.py `importorskip("yaml")`. Every pytest-running
# CI cell installs `test`; the only cell that installs `dev` (`lint`) runs
# ruff and mypy, never pytest. Without pyyaml here those tests skip in every
# cell, permanently.
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pyyaml>=6.0",
]
# Full dev extras — includes pydantic so lint/typecheck can see the IR module.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pydantic>=2.6.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "ruff>=0.16.3",
    "mypy>=1.9.0",
    "cyclonedx-bom>=4.0.0",
    "pyyaml>=6.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Binary assets + version manifest, plus PEP 561 marker for inline type hints.
"kustology" = ["py.typed"]
"kustology.bin" = ["Kusto.Language.dll", "VERSION.txt"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Re-exports — F401 unused imports are intentional in __init__.py.
# __all__ and the import block are ordered by tier, not alphabetically.
"src/kustology/ir/__init__.py" = ["F401", "RUF022", "I001"]
"src/kustology/__init__.py" = ["RUF022"]
# AnyExpr Union line is long by design; splitting would obscure the surface.
"src/kustology/ir/expr.py" = ["E501"]
# .NET failures cross the pythonnet boundary as opaque CLR types with no Python
# class to name; these modules probe defensively and fall back to a default.
"src/kustology/bridge.py" = ["BLE001"]
"src/kustology/reflection.py" = ["BLE001"]
"src/kustology/utils/analysis.py" = ["BLE001"]
"src/kustology/ir/builder.py" = ["BLE001"]
"src/kustology/ir/_builder_helpers.py" = ["BLE001"]
# Top-level error boundary: re-raises SystemExit, maps anything else to exit 1.
"src/kustology/cli.py" = ["BLE001"]
# Best-effort dev tooling — a malformed sample is skipped, not fatal.
"scripts/*.py" = ["BLE001", "S112"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["kustology"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Microsoft .NET types reach Python via pythonnet at runtime; no stubs exist.
module = ["Kusto.*", "clr", "pythonnet", "pythonnet.*", "System", "System.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tier-2 IR uses heavy pydantic Union types where mypy can't always narrow
# the operator/expression dispatch the visitor produces. The IR is pre-1.0
# and not the right place to fight mypy invariance — re-tighten once shapes
# stabilize.
module = ["kustology.ir.*"]
ignore_errors = true

[tool.kustology]
# Pinned version of Microsoft.Azure.Kusto.Language NuGet package (Kusto.Language.dll).
# Refresh with `python scripts/refresh_dll.py --pin --version X.Y.Z`.
kusto_language_version = "12.4.1"
